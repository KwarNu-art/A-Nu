name: Build SuperFPS dylib  
  
on:  
  push:  
    branches: [ main, master ]  
  pull_request:  
    branches: [ main, master ]  
  workflow_dispatch:  
  
jobs:  
  build:  
    runs-on: macos-latest  
  
    steps:  
      - name: Checkout repository  
        uses: actions/checkout@v4  
  
      - name: Select Xcode  
        run: sudo xcode-select -s /Applications/Xcode.app  
  
      - name: Show Xcode version  
        run: xcodebuild -version  
  
      - name: Check repository files  
        run: ls -la  
  
      - name: Build SuperFPS dylib (Release)  
        run: |  
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)  
          xcrun -sdk iphoneos clang -dynamiclib -arch arm64 -arch arm64e -miphoneos-version-min=14.0 -isysroot "$SDK_PATH" -framework UIKit -framework QuartzCore -framework Foundation -O2 -fobjc-arc -o SuperFPS.dylib superfps.m  
  
      - name: Find built dylib  
        run: |  
          echo "Searching for built dylib..."  
          find . -name "*.dylib" -print  
  
      - name: Upload dylib artifact  
        uses: actions/upload-artifact@v4  
        with:  
          name: superfps-dylib  
          path: SuperFPS.dylib  
